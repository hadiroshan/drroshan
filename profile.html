<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوره‌های من | دکتر هادی روشن</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64x64.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="دکتر روشن">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="پنل یادگیری شما - دوره‌های خریداری‌شده، پیشرفت دوره‌ها و سفارش‌های در جریان در وبسایت دکتر هادی روشن.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #3b82f6; --secondary: #0ea5e9; --accent: #06b6d4; --accent-light: #22d3ee;
            --dark: #0f172a; --dark-secondary: #1e293b;
            --gray: #64748b; --gray-light: #94a3b8;
            --light: #f1f5f9; --lighter: #f8fafc; --white: #ffffff;
            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            --gradient-green: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
            --radius: 12px; --radius-lg: 20px; --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            --bg: var(--lighter); --bg-card: var(--white); --text: var(--dark); --text-muted: var(--gray);
            --border: rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --bg-card: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8;
            --light: #1e293b; --lighter: #0f172a; --white: #1e293b;
            --dark: #f8fafc; --dark-secondary: #cbd5e1;
            --gray: #94a3b8; --gray-light: #64748b;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 20px;
            line-height: 1.8; direction: rtl;
            transition: background 0.4s, color 0.4s;
        }
        .wrap { max-width: 1100px; margin: 0 auto; }

        /* header card */
        .profile-head {
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            background: var(--gradient-primary); color: #fff;
            border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-lg);
            margin-bottom: 22px; position: relative; overflow: hidden;
        }
        .profile-head::after {
            content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%;
            background: rgba(255,255,255,.08); top: -120px; inset-inline-end: -80px;
        }
        .profile-head img {
            width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(255,255,255,.7);
        }
        .profile-head h1 { font-size: 1.3rem; font-weight: 900; }
        .profile-head .ph-sub { font-size: .82rem; opacity: .9; margin-top: 4px; }
        .ph-stats { display: flex; gap: 12px; margin-inline-start: auto; flex-wrap: wrap; position: relative; z-index: 1; }
        .ph-stat {
            background: rgba(255,255,255,.15); backdrop-filter: blur(4px);
            border-radius: 16px; padding: 12px 20px; text-align: center; min-width: 96px;
        }
        .ph-stat .n { font-size: 1.25rem; font-weight: 900; }
        .ph-stat .l { font-size: .72rem; opacity: .9; margin-top: 2px; }

        .topbar-actions { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
        .btn {
            font-family: inherit; cursor: pointer; border: none; border-radius: var(--radius-full);
            padding: 12px 28px; font-size: 1rem; font-weight: 600; text-decoration: none;
            background: var(--gradient-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(37,99,235,.5); }
        .btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--border); }
        .btn.ghost:hover { background: rgba(37,99,235,.08); border-color: var(--primary); transform: translateY(-3px); }
        .theme-toggle {
            width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer;
            background: var(--bg-card); font-size: 1.3rem; box-shadow: var(--shadow-lg);
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .theme-toggle:hover { transform: scale(1.1); box-shadow: var(--shadow-xl); }

        /* section titles */
        .sec-title { font-size: 1.05rem; font-weight: 900; margin: 26px 0 14px; display: flex; align-items: center; gap: 8px; }
        .sec-title::after { content: ''; display: block; width: 40px; height: 3px; background: var(--gradient-primary); border-radius: 2px; }

        /* course cards */
        .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .course {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            padding: 18px; position: relative; overflow: hidden; transition: var(--transition);
        }
        .course:hover { transform: translateY(-5px); box-shadow: var(--shadow-xl); }
        .course .c-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .course .c-emoji {
            width: 52px; height: 52px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; background: var(--gradient-primary); flex-shrink: 0;
        }
        .course h3 { font-size: .95rem; font-weight: 800; line-height: 1.5; }
        .course .c-meta { font-size: .74rem; color: var(--text-muted); margin-top: 3px; }
        .c-progress-row { display: flex; justify-content: space-between; font-size: .76rem; color: var(--text-muted); margin-bottom: 6px; }
        .c-progress-row b { color: var(--primary); }
        .track { height: 10px; border-radius: var(--radius-full); background: var(--light); overflow: hidden; }
        [data-theme="dark"] .track { background: rgba(255,255,255,.08); }
        .fill {
            height: 100%; border-radius: var(--radius-full); background: var(--gradient-primary);
            width: 0; transition: width 1s cubic-bezier(.3,.8,.3,1);
        }
        .course.done .fill { background: var(--gradient-green); }
        .course.done .c-progress-row b { color: #059669; }
        .c-actions { display: flex; gap: 8px; margin-top: 14px; }
        .c-btn {
            flex: 1; font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
            padding: 9px 0; font-size: .78rem; font-weight: 800; transition: transform .15s;
        }
        .c-btn:hover { transform: translateY(-2px); }
        .c-btn.main { background: var(--gradient-primary); color: #fff; }
        .course.done .c-btn.main { background: var(--gradient-green); }
        .c-btn.sec { background: var(--lighter); color: var(--text); border: 1.5px solid var(--border); }
        [data-theme="dark"] .c-btn.sec { background: rgba(255,255,255,.06); border-color: var(--border); }
        .c-badge {
            position: absolute; top: 14px; inset-inline-end: 14px;
            font-size: .68rem; font-weight: 900; padding: 4px 10px; border-radius: var(--radius-full);
            background: rgba(16,185,129,.14); color: #059669;
        }
        .c-badge.inprogress { background: rgba(37,99,235,.12); color: var(--primary); }
        .c-badge.notstarted { background: rgba(100,116,139,.14); color: var(--gray); }

        /* pending orders */
        .pending-card {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 16px 18px; margin-bottom: 10px;
        }
        .pending-card .p-code { font-weight: 800; color: var(--primary); }
        .pending-card .p-total { margin-inline-start: auto; font-weight: 800; font-size: .85rem; }
        .badge {
            font-size: .72rem; font-weight: 800; padding: 5px 12px; border-radius: var(--radius-full);
            background: rgba(245,158,11,.14); color: #d97706;
        }
        .badge.st-paid { background: rgba(16,185,129,.14); color: #059669; }
        .badge.st-shipped { background: rgba(59,130,246,.14); color: #2563eb; }
        .badge.st-awaiting_receipt { background: rgba(245,158,11,.14); color: #d97706; }
        .badge.st-awaiting_cod { background: rgba(100,116,139,.14); color: var(--gray); }
        .badge.st-canceled { background: rgba(239,68,68,.14); color: #dc2626; }
        .live-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #10b981; margin-inline-start: 6px; animation: livePulse 1.6s ease-in-out infinite;
        }
        @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        .live-note { font-size: .72rem; color: var(--gray); font-weight: 400; margin-inline-start: 8px; }
        .empty {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            text-align: center; padding: 50px 20px; color: var(--text-muted);
        }
        .empty .big { font-size: 3rem; margin-bottom: 10px; }

        #toast {
            position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translateX(50%);
            background: var(--dark-secondary); color: var(--light); padding: 12px 22px;
            border-radius: var(--radius-full); font-size: .85rem; font-weight: 700; opacity: 0;
            pointer-events: none; transition: opacity .3s, transform .3s; z-index: 200;
        }
        #toast.show { opacity: 1; transform: translateX(50%) translateY(-6px); }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="profile-head" id="profileHead"></header>

        <div class="topbar-actions">
            <a class="btn ghost" href="index.html#products">🎓 فروشگاه دوره‌ها</a>
            <a class="btn ghost" href="index.html">صفحه اصلی</a>
            <span style="flex:1"></span>
            <button class="theme-toggle" id="themeBtn" title="تغییر تم">🌙</button>
        </div>

        <div class="sec-title">🚚 سفارش‌های من <span class="live-note"><span class="live-dot"></span> وضعیت زنده</span></div>
        <div id="pendingBox"></div>

        <div class="sec-title">📚 دوره‌های من</div>
        <div class="courses" id="coursesBox"></div>
    </div>

    <div id="toast"></div>

    <script>
    'use strict';
    /* ---------- theme (shared) ---------- */
    const rootEl = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    try { if (localStorage.getItem('theme') === 'dark') { rootEl.setAttribute('data-theme', 'dark'); themeBtn.textContent = '☀️'; } } catch (e) {}
    themeBtn.addEventListener('click', () => {
        const dark = rootEl.hasAttribute('data-theme');
        if (dark) { rootEl.removeAttribute('data-theme'); themeBtn.textContent = '🌙'; }
        else { rootEl.setAttribute('data-theme', 'dark'); themeBtn.textContent = '☀️'; }
        try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
    });

    /* ---------- helpers ---------- */
    const faNum = n => Number(n).toLocaleString('fa-IR');
    const money = n => faNum(n) + ' تومان';
    function faDigits(s) { return String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
    function toJalali(gy, gm, gd) {
        const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
        let jy = (gy <= 1600) ? 0 : 979;
        gy -= (gy <= 1600) ? 621 : 1600;
        const gy2 = (gm > 2) ? (gy + 1) : gy;
        let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
                 + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
        jy += 33 * Math.floor(days / 12053); days %= 12053;
        jy += 4 * Math.floor(days / 1461); days %= 1461;
        if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
        const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
        const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
        return [jy, jm, jd];
    }
    function faDate(iso) {
        const d = new Date(iso);
        const [jy, jm, jd] = toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
        return faDigits(jy) + '/' + faDigits(jm) + '/' + faDigits(jd);
    }
    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
    }

    /* ---------- data ---------- */
    const PAID = 'پرداخت شده';
    let orders = [];
    let progress = {};            // { "<course name>": percent 0..100 }
    const PROG_KEY = 'hr_course_progress';
    try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { progress = {}; }

    function loadOrders() {
        try { orders = JSON.parse(localStorage.getItem('hr_orders') || '[]'); } catch (e) { orders = []; }
    }
    function saveProgress() {
        try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {}
    }
    /* merge purchased (paid) course items, summing qty and keeping first price */
    function purchasedCourses() {
        const map = new Map();
        orders.filter(o => o.status === PAID).forEach(o => (o.items || []).forEach(it => {
            if (!map.has(it.name)) map.set(it.name, { emoji: it.emoji || '🎓', name: it.name, price: it.price || 0, qty: 0, date: o.date, code: o.code });
            map.get(it.name).qty += it.qty;
        }));
        return [...map.values()];
    }
    function pendingOrders() {
        return orders.filter(o => o.status !== PAID && o.status !== 'لغو شده');
    }

    /* ---------- render ---------- */
    function render() {
        loadOrders();
        const paidCourses = purchasedCourses();
        const pend = pendingOrders();

        /* header */
        const totalProgress = paidCourses.length
            ? Math.round(paidCourses.reduce((s, c) => s + (progress[c.name] || 0), 0) / paidCourses.length)
            : 0;
        const doneCount = paidCourses.filter(c => (progress[c.name] || 0) >= 100).length;
        const hours = paidCourses.reduce((s, c) => s + c.qty * 24, 0); /* ~24h per course */
        document.getElementById('profileHead').innerHTML =
            '<img src="profile.jpg" alt="آواتار">' +
            '<div><h1>' + ((orders.find(o => o.customer && o.customer.name) || {}).customer?.name || 'دانشجوی دکتر روشن') + '</h1>' +
            '<div class="ph-sub">پنل یادگیری شما • ' + faNum(paidCourses.length) + ' دوره فعال</div></div>' +
            '<div class="ph-stats">' +
                '<div class="ph-stat"><div class="n">' + faNum(paidCourses.length) + '</div><div class="l">دوره خریداری‌شده</div></div>' +
                '<div class="ph-stat"><div class="n">' + faNum(doneCount) + '</div><div class="l">تکمیل‌شده</div></div>' +
                '<div class="ph-stat"><div class="n">٪' + faNum(totalProgress) + '</div><div class="l">میانگین پیشرفت</div></div>' +
                '<div class="ph-stat"><div class="n">' + faNum(hours) + '</div><div class="l">ساعت محتوا</div></div>' +
            '</div>';

        /* pending orders */
        const statusKeyMap = { 'پرداخت شده': 'paid', 'ارسال شد': 'shipped', 'در انتظار تایید رسید': 'awaiting_receipt', 'در انتظار پرداخت در محل': 'awaiting_cod', 'لغو شده': 'canceled' };
        const badgeCls = o => 'st-' + (o.status_key || statusKeyMap[o.status] || 'awaiting_receipt');
        const liveIcon = o => o._live ? ' <span class="live-dot"></span>' : '';
        document.getElementById('pendingBox').innerHTML = pend.length
            ? pend.map(o =>
                '<div class="pending-card"><span class="p-code">' + o.code + '</span>' +
                '<span class="badge ' + badgeCls(o) + '">' + o.status + liveIcon(o) + '</span>' +
                (o.status === 'ارسال شد' && o.tracking
                    ? '<span style="font-size:.76rem;font-weight:700;color:var(--primary)">📮 کد رهگیری: ' + faDigits(o.tracking) + '</span>'
                    : '') +
                '<span style="font-size:.78rem;color:var(--gray)">' + faDate(o.date) + '</span>' +
                '<span class="p-total">' + money(o.total || 0) + '</span>' +
                (o.status === 'ارسال شد'
                    ? ''
                    : '<a class="btn ghost" style="padding:7px 14px;font-size:.75rem" href="cart.html">تکمیل خرید</a>') + '</div>').join('')
            : '<p style="font-size:.82rem;color:var(--gray);padding:4px 6px">سفارش در انتظاری ندارید ✓</p>';

        /* courses */
        const box = document.getElementById('coursesBox');
        if (!paidCourses.length) {
            box.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🎓</div>' +
                '<p><b>هنوز دوره‌ای ندارید.</b></p>' +
                '<p style="font-size:.8rem;margin-top:6px">با اولین خرید موفق، دوره‌ها اینجا با نوار پیشرفت ظاهر می‌شوند.</p>' +
                '<a class="btn" style="margin-top:16px" href="index.html#products">مشاهده دوره‌ها</a></div>';
            requestAnimationFrame(() => box.querySelectorAll('.fill').forEach(f => f.style.width = '0%'));
            return;
        }
        box.innerHTML = paidCourses.map(c => {
            const p = progress[c.name] || 0;
            const badge = p >= 100
                ? '<span class="c-badge">✓ تکمیل شده</span>'
                : p > 0 ? '<span class="c-badge inprogress">در حال یادگیری</span>'
                        : '<span class="c-badge notstarted">شروع نشده</span>';
            return '<div class="course' + (p >= 100 ? ' done' : '') + '">' + badge +
                '<div class="c-top"><div class="c-emoji">' + c.emoji + '</div>' +
                '<div><h3>' + c.name + '</h3>' +
                '<div class="c-meta">خرید ' + faDate(c.date) + ' • سفارش ' + c.code + ' • ' + faNum(c.qty) + ' نسخه</div></div></div>' +
                '<div class="c-progress-row"><span>پیشرفت دوره</span><b>٪' + faNum(p) + '</b></div>' +
                '<div class="track"><div class="fill" data-w="' + p + '"></div></div>' +
                '<div class="c-actions">' +
                    (p >= 100
                        ? '<button class="c-btn main" data-review="' + c.name + '">📖 مرور دوره</button>'
                        : '<button class="c-btn main" data-continue="' + c.name + '">▶️ ادامه یادگیری</button>') +
                    '<button class="c-btn sec" data-cert="' + c.name + '" ' + (p >= 100 ? '' : 'disabled style="opacity:.45;cursor:not-allowed"') + '>🏅 مدرک</button>' +
                '</div></div>';
        }).join('');
        /* animate fills */
        requestAnimationFrame(() => requestAnimationFrame(() =>
            box.querySelectorAll('.fill').forEach(f => f.style.width = f.getAttribute('data-w') + '%')));
    }

    /* ---------- actions ---------- */
    document.getElementById('coursesBox').addEventListener('click', e => {
        const cont = e.target.getAttribute('data-continue');
        if (cont) {
            progress[cont] = Math.min(100, (progress[cont] || 0) + 10 + Math.floor(Math.random() * 15));
            saveProgress(); render();
            toast('▶️ پیشرفت «' + cont + '» → ٪' + faNum(progress[cont]));
            return;
        }
        const rev = e.target.getAttribute('data-review');
        if (rev) { toast('📖 مرور دوره «' + rev + '»'); return; }
        const cert = e.target.getAttribute('data-cert');
        if (cert && (progress[cert] || 0) >= 100) toast('🏅 مدرک «' + cert + '» آماده دانلود است');
    });

    window.addEventListener('storage', e => { if (e.key === 'hr_orders') render(); });

    /* ---------- وضعیت زنده سفارش‌ها از سرور (داشبورد جنگو) ---------- */
    const STATUS_CLASS = {
        'paid': 'st-paid', 'shipped': 'st-shipped', 'awaiting_receipt': 'st-awaiting_receipt',
        'awaiting_cod': 'st-awaiting_cod', 'canceled': 'st-canceled',
    };
    function mergeLiveStatuses(liveOrders) {
        /* وضعیت سرور را روی سفارش‌های localStorage اعمال کن */
        const byCode = new Map(liveOrders.map(o => [o.code, o]));
        orders.forEach(o => {
            const live = byCode.get(o.code);
            if (!live) return;
            o.status = live.status;
            o.status_key = live.status_key;
            o._live = true;
            o.tracking = live.tracking || o.tracking;
        });
        /* سفارش‌هایی که فقط در سرور هستند (مثلا مرورگر دیگر) هم اضافه شوند */
        liveOrders.forEach(live => {
            if (!orders.some(o => o.code === live.code)) {
                orders.push({
                    code: live.code, status: live.status, total: live.total, date: live.date,
                    tracking: live.tracking, items: live.items, customer: {},
                });
            }
        });
        try { localStorage.setItem('hr_orders', JSON.stringify(orders)); } catch (e) {}
    }
    async function refreshLiveStatuses() {
        const codes = orders.map(o => o.code).filter(Boolean);
        if (!codes.length) return;
        try {
            const res = await fetch('/api/orders/live-status/?codes=' + encodeURIComponent(codes.join(',')));
            const data = await res.json();
            if (data.ok && data.orders.length) { mergeLiveStatuses(data.orders); render(); }
        } catch (e) { /* آفلاین — از localStorage */ }
    }

    render();
    refreshLiveStatuses();
    setInterval(refreshLiveStatuses, 30000); /* هر ۳۰ ثانیه */
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLiveStatuses(); });
    </script>
</body>
</html>
